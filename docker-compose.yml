# Local infrastructure. Start with: docker compose up -d
# Then run the backend with: SPRING_PROFILES_ACTIVE=postgres ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      retries: 10

  redis: # used from Phase 4 (caching, rate limiting)
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
